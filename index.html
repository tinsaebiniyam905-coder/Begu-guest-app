<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ቤጉ እንግዳ - Begu Guest Registration</title>
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Noto Sans Ethiopic', sans-serif; 
          background-color: #f1f5f9; 
          margin: 0; 
          scroll-behavior: smooth;
          color: #1e293b;
        }
        #loading-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #ffffff; z-index: 9999; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); text-align: center;
        }
        .spinner {
            border: 6px solid #f1f5f9; border-top: 6px solid #1e3a8a; border-radius: 50%;
            width: 80px; height: 80px; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded #loading-screen { opacity: 0; pointer-events: none; }
        
        @media print {
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            button, .no-print, header, footer:not(.print-footer) { display: none !important; }
            .print-block { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; margin-top: 20px !important; }
            th, td { border: 2px solid #000 !important; padding: 15px !important; color: #000 !important; }
            thead { display: table-header-group !important; background-color: #eee !important; color: #000 !important; }
            tr { page-break-inside: avoid !important; }
            img { max-width: 150px !important; border: 1px solid #000 !important; }
        }
        
        /* Professional UI Polish */
        .glass-panel {
          background: rgba(255, 255, 255, 0.8);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 20px; border: 3px solid #f1f5f9; }
        ::-webkit-scrollbar-thumb:hover { background: #0f172a; }

        .animate-shake {
          animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
