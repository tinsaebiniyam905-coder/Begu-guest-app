    <style>
        body { 
          font-family: 'Noto Sans Ethiopic', sans-serif; 
          background-color: #f8fafc; 
          margin: 0; 
          scroll-behavior: smooth;
        }
        #loading-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #ffffff; z-index: 9999; transition: opacity 0.5s ease; text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #1e3a8a; border-radius: 50%;
            width: 60px; height: 60px; animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 24px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded #loading-screen { opacity: 0; pointer-events: none; }
        
        @media print {
            body { background: white; }
            button, .no-print, header, footer:not(.print-footer) { display: none !important; }
            .print-block { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #ddd !important; padding: 12px !important; }
            thead { display: table-header-group !important; }
            tr { page-break-inside: avoid !important; }
        }
        
        /* Custom scrollbar for professional feel */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0f172a; }
    </style>
